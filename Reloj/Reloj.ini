[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=44%
DefaultWindowY=50%
DefaultAnchorX=50%
DefaultAnchorY=50%
DefaultAlwaysOnTop=-2
ContextTitle=Editar ajustes
ContextAction=["notepad.exe" "#@#Variables.inc"]
ContextTitle2=Actualizar desde GitHub
ContextAction2=["#ROOTCONFIGPATH#actualizar.bat"]

[Metadata]
Name=Setup - Reloj
Author=Bre
Information=Reloj grande con la hora y los minutos apilados.
Version=1.0

[Variables]
@Include=#@#Variables.inc

; ----------------------------- Medidas -----------------------------

[mHora]
Measure=Time
Format=#FormatoHoraReloj#

[mMinutos]
Measure=Time
Format=%M

; ----------------------------- Medidores ---------------------------

[sReloj]
FontFace=#Fuente#
FontWeight=600
FontSize=(Round(150*#S#))
FontColor=#ColorReloj#
StringAlign=Center
StringEffect=Shadow
FontEffectColor=0,0,0,45
AntiAlias=1

[Fondo]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,(300*#S#),(475*#S#) | Fill Color 0,0,0,1 | StrokeWidth 0

[Hora]
Meter=String
MeterStyle=sReloj
MeasureName=mHora
X=(150*#S#)
Y=0

[Minutos]
Meter=String
MeterStyle=sReloj
MeasureName=mMinutos
X=(150*#S#)
Y=(-125*#S#)R
