[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=100%
DefaultWindowY=50%
DefaultAnchorX=100%
DefaultAnchorY=50%
DefaultAlwaysOnTop=-2
OnRefreshAction=[!CommandMeasure mBrilloLeer "Run"]
ContextTitle=Editar colores, apps y tamano
ContextAction=["notepad.exe" "#@#Variables.inc"]
ContextTitle2=Actualizar desde GitHub
ContextAction2=["#ROOTCONFIGPATH#actualizar.bat"]

[Metadata]
Name=Setup - Panel
Author=Bre
Information=Panel lateral: apps, RAM, CPU, musica, fecha, progreso del dia/mes/ano, volumen, brillo y bateria.
Version=1.0

[Variables]
@Include=#@#Variables.inc
Brillo=50

; =====================================================================
;  MEDIDAS
; =====================================================================

[mCPU]
Measure=CPU
Processor=0
AverageSize=2

[mRAM]
Measure=PhysicalMemory

[mRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[mBateria]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[mCargando]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine

[mVolumen]
Measure=Plugin
Plugin=Win7AudioPlugin

[mDia]
Measure=Time
Format=%A
FormatLocale=#Idioma#

[mFecha]
Measure=Time
Format=%#d de %B
FormatLocale=#Idioma#

[mDiaCorto]
Measure=Time
Format=%a
FormatLocale=#Idioma#
Substitute=".":""

[mNumDia]
Measure=Time
Format=%#d

[mHoraTarjeta]
Measure=Time
Format=#FormatoHoraTarjeta#

; Musica (requiere el plugin WebNowPlaying, ver README)
[mTitulo]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title

[mArtista]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist

[mPortada]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover

[mEstado]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State

; Brillo: solo se ejecuta al abrir el skin y cuando lo cambias (no consume nada en reposo)
[mBrilloLeer]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -Command (Get-CimInstance -Namespace root/WMI -ClassName WmiMonitorBrightness).CurrentBrightness
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!CommandMeasure mScript "LeerBrillo()"]

[mBrilloPoner]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -Command (Get-WmiObject -Namespace root/WMI -Class WmiMonitorBrightnessMethods).WmiSetBrightness(1,#Brillo#)
State=Hide
UpdateDivider=-1
DynamicVariables=1

; Animaciones: solo corren cuando algo cambia (no gastan nada en reposo)
[mAnimar]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Paso,16,60 | Fin
Paso=[!CommandMeasure mScript "Paso()"]
Fin=[!CommandMeasure mScript "FinAnimacion()"]
IgnoreWarnings=1

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Panel.lua

; =====================================================================
;  ESTILOS
; =====================================================================

[sMosaico]
MouseOverAction=[!CommandMeasure mScript "Hover('#CURRENTSECTION#', 1)"]
MouseLeaveAction=[!CommandMeasure mScript "Hover('#CURRENTSECTION#', 0)"]
LeftMouseDownAction=[!CommandMeasure mScript "Hover('#CURRENTSECTION#', 2)"]

[sIcono]
FontFace=#FuenteIconos#
FontSize=(Round(20*#S#))
StringAlign=CenterCenter
AntiAlias=1

[sValor]
FontFace=#Fuente#
FontWeight=600
FontSize=(Round(15*#S#))
FontColor=#ColorTexto#
StringAlign=CenterCenter
AntiAlias=1

[sEtiqueta]
FontFace=#Fuente#
FontWeight=500
FontSize=(Round(8*#S#))
FontColor=#ColorTextoSuave#
StringAlign=CenterCenter
AntiAlias=1

[sBoton]
FontFace=#FuenteIconos#
FontSize=(Round(13*#S#))
FontColor=#ColorTexto#
StringAlign=CenterCenter
SolidColor=0,0,0,1
Padding=8,6,8,6
AntiAlias=1

